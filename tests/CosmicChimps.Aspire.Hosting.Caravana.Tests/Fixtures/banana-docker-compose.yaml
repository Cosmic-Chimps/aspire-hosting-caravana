services:
  postgres:
    image: "docker.io/library/postgres:17.6"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "banana"
    expose:
      - "5432"
    networks:
      - "aspire"
  keycloak:
    image: "quay.io/keycloak/keycloak:26.4"
    environment:
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://postgres:5432/banana"
      KC_DB_USERNAME: "postgres"
      KC_DB_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "8080"
    networks:
      - "aspire"
  api:
    image: "${API_IMAGE}"
    environment:
      HTTP_PORTS: "8080"
      ConnectionStrings__postgres: "Host=postgres;Port=5432;Username=postgres;Password=${DB_PASSWORD};Database=banana"
      services__keycloak__http__0: "http://keycloak:8080"
    ports:
      - "8080"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
